# Local services for development. The app itself runs with `php artisan serve`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: madrasa
      POSTGRES_USER: madrasa
      POSTGRES_PASSWORD: secret
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
  redis:
    image: redis:7
    ports: ['6379:6379']
volumes:
  pgdata:
